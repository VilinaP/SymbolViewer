<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Symbol Monitor</h1>
        <!-- Login Section -->
        <div id="login-section">
            <button type="button" id="connect-btn">Connect to Server</button>
        </div>
    </header>
    <main>
        <!-- Symbol List Section (hidden at start) -->
        <div id="symbols-section" class="hidden">
            <button type="button" id="disconnect-btn">Disconnect</button>
            <div id="symbols-list"></div>
        </div>

        <!-- Detail Section (hidden at start) -->
        <div id="detail-section" class="hidden">
            <button type="button" id="back-btn">Back</button>
            <div id="symbol-detail">
                <h2>Symbol Name</h2>
                <p><strong>Type:</strong> <span class="symbol-type">Symbol Type</span></p>
                <p><strong>Value:</strong> <span class="symbol-value">Symbol Value</span></p>
                <p><strong>Description:</strong> <span class="symbol-description">Symbol Description</span></p>
            </div>
        </div>
        <!-- Template for the symbol card (will be cloned and added to #symbol-section) -->
        <template id="card-template">
            <div class="symbol-card">
                <div>
                    <h2>Symbol Name</h2>
                    <p><span class="symbol-type">Type</span></p>
                </div>
                <p><span class="symbol-description">Description</span></p>
            </div>
        </template>
    </main>
</body>

</html>
